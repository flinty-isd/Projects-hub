# UNVERIFIED - see ../../README.md. Best-effort sketch of a screen
# .fx.yaml, written from memory with no CLI or reference available to
# check it against. If this doesn't import, use ../formulas.md instead -
# the formulas below are the reliable part; this file's shape is the guess.
AttentionScreen:
  Control: Screen
  Properties:
    Fill: =RGBA(250, 249, 248, 1)
  Children:
    - lblTitle:
        Control: Label
        Properties:
          Text: ="Programme Overview"
          X: =20
          Y: =20
          Width: =400
          Height: =40
          Size: =20
          FontWeight: =FontWeight.Semibold

    - lblSitesComplete:
        Control: Label
        Properties:
          Text: ="209"
          X: =20
          Y: =70
          Width: =120
          Height: =50
          Size: =26

    - lblRemainingSites:
        Control: Label
        Properties:
          Text: =Text(CountRows(Filter(SP_MigrationRegister, 'Migration Status' <> "Complete")))
          X: =160
          Y: =70
          Width: =120
          Height: =50
          Size: =26

    - lblOverdueActions:
        Control: Label
        Properties:
          Text: =Text(CountRows(Filter(SP_Actions, Status <> "Closed", DueDate < Today())))
          X: =300
          Y: =70
          Width: =120
          Height: =50
          Size: =26

    - ddRAGFilter:
        Control: Classic/DropDown
        Properties:
          Items: =["All", "Red", "Amber"]
          Default: ="All"
          X: =20
          Y: =140
          Width: =160
          Height: =40

    - btnRefresh:
        Control: Classic/Button
        Properties:
          Text: ="Refresh"
          X: =200
          Y: =140
          Width: =100
          Height: =40
          OnSelect: |
            =ClearCollect(
                colAttention,
                AddColumns(
                    Filter(SP_RAID, RAG = "Red", Status = "Open"),
                    "Category", "Red RAID",
                    "Description", Title,
                    "OwnerName", Owner.DisplayName,
                    "RAGValue", "Red"
                )
            );
            Collect(
                colAttention,
                AddColumns(
                    Filter(SP_Actions, Status <> "Closed", DueDate < Today()),
                    "Category", "Overdue Action",
                    "Description", Title,
                    "OwnerName", Owner.DisplayName,
                    "RAGValue", "Red"
                )
            );
            Collect(
                colAttention,
                AddColumns(
                    Filter(SP_MigrationRegister, 'Migration Status' = "Blocked"),
                    "Category", "Blocked Site",
                    "Description", Title & " - " & 'Blocker / Dependency',
                    "OwnerName", 'Migration Owner'.DisplayName,
                    "RAGValue", "Red"
                )
            );
            Collect(
                colAttention,
                AddColumns(
                    Filter(SP_Decisions, Status = "Pending"),
                    "Category", "Decision Required",
                    "Description", Title,
                    "OwnerName", Owner.DisplayName,
                    "RAGValue", "Amber"
                )
            );

    - galAttention:
        Control: Classic/Gallery
        Properties:
          TemplateSize: =70
          Layout: =Layout.Vertical
          Items: =If(ddRAGFilter.Selected.Value = "All", colAttention, Filter(colAttention, RAGValue = ddRAGFilter.Selected.Value))
          X: =20
          Y: =200
          Width: =800
          Height: =500
        Children:
          - rectRAG:
              Control: Rectangle
              Properties:
                Fill: =If(ThisItem.RAGValue = "Red", RGBA(168, 0, 0, 1), RGBA(152, 111, 11, 1))
                X: =0
                Y: =0
                Width: =6
                Height: =Parent.TemplateHeight

          - lblCategory:
              Control: Label
              Properties:
                Text: =ThisItem.Category
                X: =16
                Y: =6
                Width: =160
                Height: =24
                Size: =11
                Color: =RGBA(96, 94, 92, 1)

          - lblDescription:
              Control: Label
              Properties:
                Text: =ThisItem.Description
                X: =16
                Y: =30
                Width: =600
                Height: =30
                Size: =13

          - lblOwner:
              Control: Label
              Properties:
                Text: =ThisItem.OwnerName
                X: =630
                Y: =6
                Width: =160
                Height: =24
                Size: =12
                Align: =Align.Right
