name: Governance flows

on:
  pull_request:
    paths:
      - "solutions/SharePointGovernance/**"
      - "solutions/*/sharepoint/list-schema.json"
      - "solutions/*/solution-config.json"
  push:
    branches: [main]
    paths:
      - "solutions/SharePointGovernance/**"
      - "solutions/*/sharepoint/list-schema.json"
      - "solutions/*/solution-config.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate flow definitions against the list schema
        run: python solutions/SharePointGovernance/tools/validate_flows.py
      - name: Validate the dashboard views against the list schema
        run: python solutions/SharePointGovernance/tools/validate_dashboard.py
      - name: Check the list schemas page matches every solution's schema
        run: python solutions/SharePointGovernance/tools/build_schema_page.py --check
      - name: Build the solution package and the deployment kit
        run: python solutions/SharePointGovernance/tools/build_kit.py --out dist
      - name: Upload solution package
        uses: actions/upload-artifact@v4
        with:
          name: SharePointGovernance-solution
          path: dist/SharePointGovernance_*.zip
      - name: Upload deployment kit
        uses: actions/upload-artifact@v4
        with:
          name: SharePointGovernance-DeploymentKit
          path: dist/SharePointGovernance-DeploymentKit_*.zip
